name: Deployer FabLab DEV
on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Full Application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e # Exit immediately if a command exits with a non-zero status.
            echo "Starting deployment process..."

            # Arrêt des services
            echo "Stopping services..."
            systemctl stop fablab-api.service || echo "API service not running"
            systemctl stop fablab-frontend.service || echo "Frontend service not running"

            # Copie du fichier de logs
            echo 'Moving logs file to logs backup folder'
            DATE=$(date +'%Y-%m-%d_%H-%M')
            #Pas encore de logs dans notre app
            #[ -f "/var/www/fablab/API/logs.txt" ] && cp /var/www/fablab/API/logs.txt /var/www/logs/logs_FabLab_$DATE.txt

            # Suppression et recréation du répertoire GestionnaireHoraire
            echo "Refreshing project directory..."
            mkdir -p /var/www/fablab
            find /var/www/fablab -mindepth 1 -delete

            #Préparation du VENV
            echo "Cloning fresh repository..."
            git clone --branch ${{ github.ref_name }} --depth 1 https://github.com/ecoleduweb/HoraireFabLab.git /var/www/fablab
            # Préparation du VENV
            cd /var/www/fablab/API
            python3 -m venv venv
            source venv/bin/activate

            # Dépendances système pour mysqlclient
            pip install -r requirements.txt
            
            # Configuration API
            echo "Configuring API..."
            cat > .env << EOF
            DB_USER=${{ secrets.DEV_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            DJANGO_SECRET_KEY= ${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG= ${{ secrets.DJANGO_DEBUG }}
            DJANGO_ALLOWED_HOSTS= ${{ secrets.DJANGO_ALLOWED_HOSTS }}
            DJANGO_ENV=
            DB_NAME=${{ secrets.DEV_DB_NAME}}
            DB_HOST=${{ secrets.DEV_DB_HOST }}
            DB_PORT=${{ secrets.DEV_DB_PORT }}
            JWT_COOKIE_SECURE=${{ secrets.JWT_COOKIE_SECURE }}
            EOF


            echo "Running migrations..."
            python manage.py migrate --noinput

            # Configuration Frontend
            echo "Configuring Frontend..."
            cd /var/www/fablab/FabLab
            cat > .env << EOF
            PUBLIC_BASE_URL=${{ secrets.DEV_BASEURL_API}}
            BASE_PATH=${{secrets.DEV_BASE_PATH}}
            EOF

            echo "Building Frontend..."
            npm ci
            npm run build
            npm run build

            # Démarrage des services
            echo "Starting services..."
            systemctl start fablab-api.service || echo "Failed to start API service"
            systemctl start fablab-frontend.service || echo "Failed to start Frontend service"

            # Vérification
            echo "Checking services status..."
            systemctl status fablab-api.service --no-pager
            systemctl status fablab-frontend.service --no-pager

            echo "Deployment completed successfully!"
