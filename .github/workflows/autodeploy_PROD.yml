name: Deployer Emploi Etudiant PROD
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Full Application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            umask 0027
            echo "Starting PROD deployment process..."

            APP_DIR=/var/www/ProjetApplicationH2024
            APP_GROUP=webapp
            export UV_PYTHON_INSTALL_DIR=/opt/ProjetApplicationH2024/python
            export PATH="$HOME/.local/bin:$PATH"

            # Arrêt des services
            echo "Stopping services..."
            systemctl stop front-end || echo "Front-end service not running"
            systemctl stop back-end || echo "Back-end service not running"

            # Copie du fichier de logs
            echo "Moving logs file to logs backup folder..."
            mkdir -p ~/logs
            DATE=$(date +'%Y-%m-%d_%H-%M')
            if [ -f "$APP_DIR/back-end/API/logs.txt" ]; then
              cp "$APP_DIR/back-end/API/logs.txt" ~/logs/logs_$DATE.txt
            fi

            # Suppression et recréation du répertoire
            echo "Refreshing project directory..."
            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -delete

            # Clone du projet
            echo "Cloning fresh repository..."
            git clone --branch ${{ github.ref_name }} --depth 1 https://github.com/${{ github.repository }}.git "$APP_DIR"

            # Préparation du VENV (Python 3.15 via uv)
            echo "Preparing Python environment..."
            command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
            cd "$APP_DIR/back-end"
            uv venv --python 3.15 venv
            uv pip install --python venv -r requirements.txt gunicorn

            # Configuration API
            echo "Configuring API..."
            cd "$APP_DIR/back-end/API"
            cat > .env << 'EOF'
            DATABASE_TEST_URL=${{ secrets.DATABASE_TEST_URL }}
            DATABASE_DEV_URL=${{ secrets.DATABASE_PROD_URL }}
            CORS=${{ secrets.PROD_CORS_IP }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            MAIL_ENABLED=True
            MAIL_CLIENT_ID=${{ secrets.MAIL_CLIENT_ID }}
            CLIENT_SECRET=${{ secrets.MAIL_CLIENT_SECRET }}
            TENANT_ID=${{ secrets.MAIL_TENANT_ID }}
            MAIL_GRAPH_USER_ID=${{ secrets.MAIL_GRAPH_USER_ID }}
            MAIL_ADMINISTRATOR_ADDRESS=${{ secrets.MAIL_ADMINISTRATOR_ADDRESS }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            RECAPTCHA_KEY=${{ secrets.RECAPTCHA_KEY }}
            URL=${{ secrets.PROD_URL }}
            ENABLE_TRACING=True
            TRACE_URL=https://telemetry.edwrdl.ca/traces
            APPLICATION_NAME=API_EMPLOI_ETUDIANT_PROD
            EOF

            echo "Running migrations..."
            ../venv/bin/flask db upgrade

            # Configuration Frontend
            echo "Configuring Frontend..."
            cd "$APP_DIR/front-end/projet_application"
            cat > .env << 'EOF'
            PUBLIC_BASE_URL=${{ secrets.PROD_FRONT_PUBLIC_URL }}
            PUBLIC_RECAPTCHA_KEY=${{ secrets.PUBLIC_RECAPTCHA_KEY }}
            PUBLIC_PUBLIC_MEASUREMENT_ID=${{ secrets.PUBLIC_PUBLIC_MEASUREMENT_ID }}
            PUBLIC_TRACE_URL=https://telemetry.edwrdl.ca/traces
            PUBLIC_APPLICATION_NAME=EMPLOI_ETUDIANT_PROD
            PUBLIC_ENABLED_TELEMETRY=TRUE
            EOF

            echo "Building Frontend..."
            npm ci
            npm run build

            # Permissions pour l'utilisateur des services (groupe webapp)
            echo "Setting permissions..."
            chgrp -R "$APP_GROUP" "$APP_DIR" "$UV_PYTHON_INSTALL_DIR"
            chmod -R g+rX,o-rwx "$APP_DIR" "$UV_PYTHON_INSTALL_DIR"
            chmod 640 "$APP_DIR/back-end/API/.env"
            chmod g+w "$APP_DIR/back-end/API"   # pour que le service puisse écrire logs.txt

            # Démarrage des services
            echo "Starting services..."
            systemctl start back-end
            systemctl start front-end

            # Vérification
            echo "Checking services status..."
            systemctl status back-end --no-pager
            systemctl status front-end --no-pager

            echo "PROD Deployment completed successfully!"
