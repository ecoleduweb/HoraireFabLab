name: Playwright Tests

permissions:
  contents: write
  pages: write
  id-token: write

on:
  pull_request:
    paths:
      - "FabLab/**"
      - "Playwright/**"
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04   # was ubuntu-latest (now 26.04, unsupported by Playwright < 1.61)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Configure Frontend Environment
        run: |
          echo "Configuring Frontend..."
          cat > .env << EOF
          PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}
          EOF
        working-directory: FabLab

      - name: Install front-end dependencies
        run: npm ci
        working-directory: FabLab

      - name: Install playwright test dependencies
        run: npm ci
        working-directory: Playwright

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps
        working-directory: Playwright

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: Playwright

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./Playwright/playwright-report/
          retention-days: 1